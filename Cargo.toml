[package]
name = "invman"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.23.1", features = ["v7", "serde"] }
time = { version = "0.3.47", features = ["serde", "std", "formatting", "parsing", "macros"] }
getset = "0.1.6"
toml = "1.1.2+spec-1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
headless_chrome = "1.0.21"
bon = "3.9.1"
anyhow = "1.0.102"
derive_more = { version = "2.1.1", features = ["display"] }
